<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .container {
            border: 2px solid red;
            height: 70vh;
            display: flex;
            /* justify-content: center; */
            align-items: center;
            /* flex-direction: column; */
            /* flex-wrap: wrap; */
            /* align-content: center; */
            /*where there is mulitple line after flex wrap property */
            /* there is no justfy items  */
            /* flex-flow: row wrap; */
            gap: 10px 30px;
        }

        .item {
            flex-grow: 1;
            width: 80px;
            height: 30px;
            border: 2px solid rgb(1, 12, 1);
            background-color: purple;
            /* margin: 5px; */
            color: white;
            font-size: xx-large;
        }

        .order1
        {

            order: 1;
        }

          .order2
        {

            order: 2;
        }

          .order3
        {

            order: 3;
        }

        .item1{
            /* flex-grow: 8; */
            /* flex-shrink: 2; */
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item order1">4</div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        

    </div>
</body>

</html>
