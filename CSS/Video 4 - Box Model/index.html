<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics of Box Model present in CSS</title>
    <style>
     *
     {
        border: 0px;
        padding: 0px; 
     }   
    .box
    {
    background-color: rgb(228, 141, 10);
    }

    .box1
    {
        color: cadetblue;
        padding: 10px;
        margin: 25px;
        border: 5px solid blue;
        height: 200px;
        box-sizing: border-box;
    }

    .box2
    {
        color: rebeccapurple;
        padding: 10px;
        margin: 25px;
        border: 5px solid rgb(154, 17, 110);
        height: 200px;
   

    }
    </style>
</head>
<body>
    <div class="box box1">I am in Box 1</div>  
    <div class="box box2">I am in Box 2</div>  
</body>
</html>
