<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 2</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-areas: "nav nav nav"
                "side article article"
                "footer footer footer";
        }

        .item {
            border: 2px solid rgba(106, 18, 89, 0.913);
            height: 55px;
            /* width: 55px; */
        }

        .item-1 {
            grid-area: nav;
            background-color: cadetblue;

        }
        .item-2 {
            grid-area: side;
            background-color: rgb(138, 204, 7);
        }
        .item-3 {
            grid-area: article;
            background-color: rgb(204, 86, 7);

        }
        .item-4 {
            grid-area: footer;
            background-color: rgb(7, 216, 153);
        }

         .item-5 {
            grid-area: nav; 
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4 ">4</div>
        <div class="item item-5">5</div>
</body>

</html>
