<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mutil color website</title>
    <style>
        :root{
            --vad: red;
            --bg:rgba(105, 228, 17, 0.26);
            --fc:rgb(20, 120, 234);
        }
        body{
            margin: 0;
            padding: 0;
        } 
        .nav{
            background-color: var(--bg);
    
        }

         li {
            border: 2px solid var(--vad);
            padding: 20px;
            list-style-type: none;
            
           
            
          
        }

        .list{
            display: flex;  
            width: 90vw;
            /* height: 70px; */
             gap: 20px;
             margin: 0px;
             padding: 0%; 
            color: var(--fc);

        }

    </style>
</head>
<body>
    <div class="nav">
        <ul class="list">
            <li>About</li>
            <li>Home</li>
            <li>Log out</li>            
        </ul>
    </div>
    
</body>
</html>
