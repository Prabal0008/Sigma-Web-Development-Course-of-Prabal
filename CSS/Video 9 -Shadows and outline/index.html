<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box {
            box-shadow: 11px 6px 8px 4px #23bccf88;

        }
        .par{
            font-size: large;
            text-shadow:11px 6px 8px #95e20588 ;
            outline: 2px solid black;
            border: 2px solid red;
        }
    </style>
</head>

<body>
    <div class="box">
        I am div
    </div>
    <p class="par">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam nihil nobis assumenda optio, rerum
        beatae doloremque rem itaque fuga illo inventore esse facilis.</p>


</body>

</html>
