<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic</title>
    <style>
        .parent {
            position: sticky;
            top: 0px;
            border: solid 2px red;
            height: 100px;
            background-color: aqua;
        }


        .child {
            border: solid 2px red;
            height: 6000px;
            background-color: rgb(65, 232, 32);
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="one"></div>
    </div>

    <div class="child">
        <div></div>
    </div>




</body>

</html>
