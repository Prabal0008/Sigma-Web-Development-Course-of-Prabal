<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postition Property</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid rgb(198, 11, 89);
            /* position: absolute; */

        }

        .box1 {
            background-color: aquamarine;
            position: sticky;
            top: 0px;
            left: 100%;
            height: 111px;
            /* width: 1vw; */
            margin: 0;
            padding: 0;

        }

        .box2 {
            background-color: blueviolet;
            /* position: relative; */
            /* top: 24px;
            left: 15px; */

        }

        .box3 {
            background-color: chartreuse;
            /* position: fixed;
            top: 90vh;
            left: 54px; */

        }

        .box4 {
            background-color: cadetblue;
        }

        .box {
            height: 500px;
            width: 80vw;
            border: 2px solid black;
            padding: 3px;
            margin: 3px;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
